<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./frontend/diseños/css/estilos.css">
    <title>Document</title>
</head>
<style>
:root {
      --sidebar-bg: #1e222d;
      --sidebar-text: #94a3b8;
      --sidebar-active: #ffffff;
      --main-bg: #f4f6f9;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --primary: #ec4899;
      --primary-hover: #db2777;
      --border: #e2e8f0;
      --success-bg: #dcfce7;
      --success-text: #15803d;
      --danger-bg: #fee2e2;
      --danger-text: #ef4444;
      --warning-bg: #fef3c7;
      --warning-text: #b45309;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { display: flex; height: 100vh; background-color: var(--main-bg); color: var(--text-dark); overflow: hidden; }

    aside {
      width: 260px;
      background-color: var(--sidebar-bg);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    aside .brand { color: #fff; font-size: 1.2rem; font-weight: bold; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
    aside .filter-group { margin-bottom: 20px; }
    aside label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #64748b; font-weight: bold; display: block; margin-bottom: 8px; }
    aside input, aside select {
      width: 100%;
      padding: 10px;
      background: #2a2e3d;
      border: 1px solid #3b4252;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
    }
    aside input::placeholder { color: #64748b; }

    main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }

    header {
      background: var(--card-bg);
      height: 60px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
    }
    header .nav-links { display: flex; gap: 20px; font-weight: 500; font-size: 0.95rem; }
    header .nav-links a { text-decoration: none; color: #64748b; padding-bottom: 18px; }
    header .nav-links a.active { color: var(--primary); border-bottom: 2px solid var(--primary); font-weight: 600; }
    header .user-profile { font-size: 0.9rem; color: #64748b; }
    
    .content { padding: 30px; display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }

    .card { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }

    .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #f1f5f9; color: #475569; border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; }

    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th { background: #f8fafc; color: #64748b; font-weight: 600; padding: 12px; border-bottom: 1px solid var(--border); text-transform: uppercase; font-size: 0.75rem; }
    td { padding: 14px 12px; border-bottom: 1px solid var(--border); color: var(--text-dark); }
    tr:hover { background-color: #f8fafc; }

    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
    .badge-ok { background: var(--success-bg); color: var(--success-text); }
    .badge-danger { background: var(--danger-bg); color: var(--danger-text); }
    .badge-warning { background: var(--warning-bg); color: var(--warning-text); }


    .pos-panel h3 { margin-bottom: 15px; font-size: 1.1rem; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #475569; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }

    </style>
<body>
    <aside>
    <div class="brand">Panadería: Por Tomas y Yerick</div>
    
    <div class="filter-group">
      <label>Buscar Producto</label>
      <input type="text" id="search-input" placeholder="Nombre del producto..." oninput="filtrarProductos()">
    </div>

    <div class="filter-group">
      <label>Estado / Alerta</label>
      <select id="filter-alert" onchange="filtrarProductos()">
        <option value="todos">Todos los productos</option>
        <option value="critico">Stock Bajo</option>
        <option value="vencer">Próximos a Vencer</option>
      </select>
    </div>
  </aside>

  <main>
    <header>
      <div class="nav-links">
        <a href="#" class="active">Productos & Inventario</a>
        <a href="#">Reportes del Día</a>
      </div>
      <div class="user-profile">
        <span>● Backend Conectado (Port 3000)</span>
      </div>
    </header>

    <div class="content">
      <div class="card">
        <div class="actions-bar">
          <h2 style="font-size:1.2rem;">Catálogo de Inventario</h2>
          <button class="btn-secondary" onclick="cargarDatos()"> Actualizar Tabla</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>NOMBRE</th>
              <th>PRECIO</th>
              <th>STOCK</th>
              <th>ESTADO HOY</th>
            </tr>
          </thead>
          <tbody id="tabla-body">
            <tr><td colspan="5">Cargando inventario desde Node.js...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="card pos-panel">
        <h3>Registrar Venta</h3>
        <form onsubmit="procesarVenta(event)">
          <div class="form-group">
            <label>Método de Pago</label>
            <select id="metodo_pago" required>
              <option value="efectivo">Efectivo</option>
              <option value="transferencia">Transferencia (Nequi/Daviplata)</option>
            </select>
          </div>

          <div class="form-group">
            <label>Monto Total ($)</label>
            <input type="number" id="total_venta" value="8000" required>
          </div>

          <button type="submit" class="btn-primary" style="width: 100%;">Procesar Venta</button>
        </form>

        <div id="venta-res" style="margin-top: 15px;"></div>
      </div>
    </div>
  </main>

  <script>
    const API_URL = 'http://localhost:3000/api';
    let productosCache = [];
    let alertasCache = { stockBajo: [], proximosAVencer: [] };

    async function cargarDatos() {
      try {
        const resProd = await fetch(`${API_URL}/productos`);
        const jsonProd = await resProd.json();
        productosCache = jsonProd.data;

        const resAlert = await fetch(`${API_URL}/productos/alertas`);
        const jsonAlert = await resAlert.json();
        alertasCache = jsonAlert.alertas;

        renderTabla(productosCache);
      } catch (err) {
        document.getElementById('tabla-body').innerHTML = `<tr><td colspan="5" style="color:red;">Error al conectar con la API</td></tr>`;
      }
    }

    function renderTabla(lista) {
      const tbody = document.getElementById('tabla-body');
      tbody.innerHTML = '';

      if (lista.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5">No se encontraron productos.</td></tr>`;
        return;
      }

      lista.forEach(p => {
        const esBajo = alertasCache.stockBajo.some(a => a.id === p.id);
        const esVencer = alertasCache.proximosAVencer.some(a => a.id === p.id);

        let badge = '<span class="badge badge-ok">Normal</span>';
        if (esBajo) badge = '<span class="badge badge-danger">Stock Bajo</span>';
        else if (esVencer) badge = '<span class="badge badge-warning">Próximo a Vencer</span>';

        tbody.innerHTML += `
          <tr>
            <td>#00${p.id}</td>
            <td><strong>${p.nombre}</strong></td>
            <td>$${p.precio.toLocaleString()}</td>
            <td>${p.stock} un.</td>
            <td>${badge}</td>
          </tr>
        `;
      });
    }

    function filtrarProductos() {
      const texto = document.getElementById('search-input').value.toLowerCase();
      const filtroAlerta = document.getElementById('filter-alert').value;

      let resultado = productosCache.filter(p => p.nombre.toLowerCase().includes(texto));

      if (filtroAlerta === 'critico') {
        resultado = resultado.filter(p => alertasCache.stockBajo.some(a => a.id === p.id));
      } else if (filtroAlerta === 'vencer') {
        resultado = resultado.filter(p => alertasCache.proximosAVencer.some(a => a.id === p.id));
      }

      renderTabla(resultado);
    }

    async function procesarVenta(e) {
      e.preventDefault();
      const metodo_pago = document.getElementById('metodo_pago').value;
      const total = Number(document.getElementById('total_venta').value);

      try {
        const res = await fetch(`${API_URL}/ventas`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            metodo_pago,
            total,
            items: [{ id_producto: 1, cantidad: 2, precio_unitario: 2000 }]
          })
        });

        const data = await res.json();
        const resDiv = document.getElementById('venta-res');

        if (data.success) {
          resDiv.innerHTML = `<div style="padding:10px; background:var(--success-bg); color:var(--success-text); border-radius:6px; font-size:0.85rem;">✅ ${data.message} (ID Venta: ${data.data.id_venta})</div>`;
        }
      } catch (err) {
        alert('Error conectando con la API');
      }
    }

    cargarDatos();
  </script>
</body>
</html>
</body>
</html>
