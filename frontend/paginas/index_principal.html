<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Panadería - Dashboard</title>
  <style>
    :root {
      --sidebar-bg: #1e222d;
      --sidebar-text: #94a3b8;
      --main-bg: #f4f6f9;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --primary: #ec4899;
      --primary-hover: #db2777;
      --border: #e2e8f0;
      --success-bg: #dcfce7;
      --success-text: #15803d;
      --danger-bg: #fee2e2;
      --danger-text: #ef4444;
      --warning-bg: #fef3c7;
      --warning-text: #b45309;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { display: flex; height: 100vh; background-color: var(--main-bg); color: var(--text-dark); overflow: hidden; }

    /* SIDEBAR */
    aside { width: 260px; background-color: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; padding: 20px; }
    aside .brand { color: #fff; font-size: 1.2rem; font-weight: bold; margin-bottom: 30px; }
    aside .filter-group { margin-bottom: 20px; }
    aside label { font-size: 0.75rem; text-transform: uppercase; color: #64748b; font-weight: bold; display: block; margin-bottom: 8px; }
    aside input, aside select { width: 100%; padding: 10px; background: #2a2e3d; border: 1px solid #3b4252; border-radius: 6px; color: #fff; font-size: 0.9rem; }

    /* MAIN */
    main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
    header { background: var(--card-bg); height: 60px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
    header .nav-links a { text-decoration: none; color: var(--primary); font-weight: 600; border-bottom: 2px solid var(--primary); padding-bottom: 18px; }

    .content { padding: 30px; display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 25px; }
    .card { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); margin-bottom: 20px; }
    .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

    /* TABLAS */
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th { background: #f8fafc; color: #64748b; font-weight: 600; padding: 10px; border-bottom: 1px solid var(--border); text-transform: uppercase; font-size: 0.75rem; text-align: left; }
    td { padding: 12px 10px; border-bottom: 1px solid var(--border); }

    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .badge-ok { background: var(--success-bg); color: var(--success-text); }
    .badge-danger { background: var(--danger-bg); color: var(--danger-text); }
    .badge-warning { background: var(--warning-bg); color: var(--warning-text); }

    /* FORMULARIOS */
    .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #f1f5f9; color: #475569; border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #475569; }
    .form-group input, .form-group select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside>
    <div class="brand">🥐 Panadería POS</div>
    
    <div class="filter-group">
      <label>Buscar Producto</label>
      <input type="text" id="search-input" placeholder="Nombre..." oninput="filtrarProductos()">
    </div>

    <div class="filter-group">
      <label>Estado / Alertas</label>
      <select id="filter-alert" onchange="filtrarProductos()">
        <option value="todos">Todos los productos</option>
        <option value="critico">⚠️ Stock Bajo</option>
      </select>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main>
    <header>
      <div class="nav-links">
        <a href="#">Sistema POS & Inventario</a>
      </div>
      <div>
        <span style="color:#22c55e; font-size: 0.85rem; font-weight: 600;">● MySQL Conectado</span>
      </div>
    </header>

    <div class="content">
      <!-- COLUMNA IZQUIERDA: TABLAS -->
      <div>
        <!-- TABLA PRODUCTOS -->
        <div class="card">
          <div class="actions-bar">
            <h3>📦 Catálogo de Productos</h3>
            <button class="btn-secondary" onclick="cargarTodo()">🔄 Actualizar</button>
          </div>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Producto</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="tabla-body">
              <tr><td colspan="5">Cargando productos...</td></tr>
            </tbody>
          </table>
        </div>

        <!-- TABLA HISTORIAL DE VENTAS -->
        <div class="card">
          <div class="actions-bar">
            <h3>📜 Historial de Ventas</h3>
          </div>
          <table>
            <thead>
              <tr>
                <th># Venta</th>
                <th>Fecha</th>
                <th>Total</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="tabla-ventas">
              <tr><td colspan="4">Cargando ventas...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- COLUMNA DERECHA: REGISTRO POS Y NUEVO PRODUCTO -->
      <div>
        <!-- PANEL POS -->
        <div class="card">
          <h3>🛒 Registrar Venta (POS)</h3>
          <form onsubmit="procesarVenta(event)">
            <div class="form-group">
              <label>Seleccionar Producto</label>
              <select id="pos_producto" onchange="actualizarTotalPOS()" required>
                <option value="">Cargando productos...</option>
              </select>
            </div>

            <div class="form-group">
              <label>Cantidad</label>
              <input type="number" id="pos_cantidad" value="1" min="1" oninput="actualizarTotalPOS()" required>
            </div>

            <div class="form-group">
              <label>Método de Pago</label>
              <select id="metodo_pago" required>
                <option value="efectivo">Efectivo</option>
                <option value="transferencia">Transferencia (Nequi/Daviplata)</option>
              </select>
            </div>

            <div class="form-group">
              <label>Monto Total ($)</label>
              <input type="number" id="total_venta" readonly style="background:#f1f5f9; font-weight:bold;">
            </div>

            <button type="submit" class="btn-primary" style="width: 100%;">Procesar Venta</button>
          </form>
          <div id="venta-res" style="margin-top: 10px;"></div>
        </div>

        <!-- AGREGAR PRODUCTO -->
        <div class="card">
          <h3>➕ Agregar Producto</h3>
          <form onsubmit="registrarProducto(event)">
            <div class="form-group">
              <label>Nombre</label>
              <input type="text" id="prod_nombre" required>
            </div>

            <div class="form-group">
              <label>Categoría</label>
              <select id="prod_categoria" required>
                <option value="1">Panadería</option>
                <option value="2">Repostería</option>
              </select>
            </div>

            <div class="form-group">
              <label>Precio ($)</label>
              <input type="number" id="prod_precio" step="0.01" required>
            </div>

            <div class="form-group">
              <label>Stock Inicial</label>
              <input type="number" id="prod_stock" required>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%;">Guardar Producto</button>
          </form>
          <div id="prod-res" style="margin-top: 10px;"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API_URL = 'http://localhost:3000/api';
    let productosCache = [];
    let alertasCache = { stockBajo: [] };

    async function cargarTodo() {
      await cargarProductos();
      await cargarVentas();
    }

    async function cargarProductos() {
      try {
        const resProd = await fetch(`${API_URL}/productos`);
        const jsonProd = await resProd.json();
        productosCache = jsonProd.data;

        const resAlert = await fetch(`${API_URL}/productos/alertas`);
        const jsonAlert = await resAlert.json();
        alertasCache = jsonAlert.alertas;

        renderTablaProductos(productosCache);
        poblarSelectorProductos();
      } catch (err) {
        document.getElementById('tabla-body').innerHTML = `<tr><td colspan="5" style="color:red;">Error al conectar con la API</td></tr>`;
      }
    }

    function renderTablaProductos(lista) {
      const tbody = document.getElementById('tabla-body');
      tbody.innerHTML = '';

      if (lista.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5">No hay productos disponibles.</td></tr>`;
        return;
      }

      lista.forEach(p => {
        const esBajo = alertasCache.stockBajo.some(a => a.id_producto === p.id_producto);
        let badge = esBajo ? '<span class="badge badge-danger">Stock Bajo</span>' : '<span class="badge badge-ok">Normal</span>';

        tbody.innerHTML += `
          <tr>
            <td>#00${p.id_producto}</td>
            <td><strong>${p.nombre}</strong></td>
            <td>$${Number(p.precio).toLocaleString()}</td>
            <td>${p.stock} un.</td>
            <td>${badge}</td>
          </tr>
        `;
      });
    }

    function poblarSelectorProductos() {
      const select = document.getElementById('pos_producto');
      select.innerHTML = '<option value="">Seleccione un producto...</option>';

      productosCache.forEach(p => {
        select.innerHTML += `<option value="${p.id_producto}" data-precio="${p.precio}">${p.nombre} - $${Number(p.precio).toLocaleString()} (Stock: ${p.stock})</option>`;
      });

      actualizarTotalPOS();
    }

    function actualizarTotalPOS() {
      const select = document.getElementById('pos_producto');
      const cantidad = Number(document.getElementById('pos_cantidad').value) || 0;
      const selectedOption = select.options[select.selectedIndex];

      if (selectedOption && selectedOption.dataset.precio) {
        const precioUnitario = Number(selectedOption.dataset.precio);
        document.getElementById('total_venta').value = precioUnitario * cantidad;
      } else {
        document.getElementById('total_venta').value = 0;
      }
    }

    async function procesarVenta(e) {
      e.preventDefault();
      const id_producto = Number(document.getElementById('pos_producto').value);
      const cantidad = Number(document.getElementById('pos_cantidad').value);
      const select = document.getElementById('pos_producto');
      const selectedOption = select.options[select.selectedIndex];

      if (!id_producto) {
        alert('Por favor selecciona un producto.');
        return;
      }

      const precio_unitario = Number(selectedOption.dataset.precio);

      try {
        const res = await fetch(`${API_URL}/ventas`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id_cliente: 1,
            id_usuario: 1,
            items: [{ id_producto, cantidad, precio_unitario }]
          })
        });

        const data = await res.json();
        const resDiv = document.getElementById('venta-res');

        if (data.success) {
          resDiv.innerHTML = `<div style="padding:8px; background:var(--success-bg); color:var(--success-text); border-radius:6px; font-size:0.85rem;">✅ Venta #${data.data.id_venta} registrada correctamente</div>`;
          cargarTodo();
        } else {
          resDiv.innerHTML = `<div style="padding:8px; background:var(--danger-bg); color:var(--danger-text); border-radius:6px; font-size:0.85rem;">❌ ${data.message}</div>`;
        }
      } catch (err) {
        alert('Error conectando con la API de ventas');
      }
    }

    async function cargarVentas() {
      try {
        const res = await fetch(`${API_URL}/ventas`);
        const data = await res.json();
        const tbody = document.getElementById('tabla-ventas');
        tbody.innerHTML = '';

        if (!data.data || data.data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4">No se han registrado ventas hoy.</td></tr>`;
          return;
        }

        data.data.forEach(v => {
          const fecha = new Date(v.fecha_venta).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          tbody.innerHTML += `
            <tr>
              <td>#00${v.id_venta}</td>
              <td>${fecha}</td>
              <td><strong>$${Number(v.total).toLocaleString()}</strong></td>
              <td><span class="badge badge-ok">${v.estado}</span></td>
            </tr>
          `;
        });
      } catch (err) {
        document.getElementById('tabla-ventas').innerHTML = `<tr><td colspan="4" style="color:red;">Error cargando historial</td></tr>`;
      }
    }

    async function registrarProducto(e) {
      e.preventDefault();
      const nombre = document.getElementById('prod_nombre').value;
      const id_categoria = Number(document.getElementById('prod_categoria').value);
      const precio = Number(document.getElementById('prod_precio').value);
      const stock = Number(document.getElementById('prod_stock').value);

      try {
        const res = await fetch(`${API_URL}/productos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, id_categoria, precio, stock })
        });

        const data = await res.json();
        const resDiv = document.getElementById('prod-res');

        if (data.success) {
          resDiv.innerHTML = `<div style="padding:8px; background:var(--success-bg); color:var(--success-text); border-radius:6px; font-size:0.85rem;">✅ ${data.message}</div>`;
          e.target.reset();
          cargarTodo();
        }
      } catch (err) {
        alert('Error al crear producto');
      }
    }

    function filtrarProductos() {
      const texto = document.getElementById('search-input').value.toLowerCase();
      const filtroAlerta = document.getElementById('filter-alert').value;

      let resultado = productosCache.filter(p => p.nombre.toLowerCase().includes(texto));

      if (filtroAlerta === 'critico') {
        resultado = resultado.filter(p => alertasCache.stockBajo.some(a => a.id_producto === p.id_producto));
      }

      renderTablaProductos(resultado);
    }

    // Inicializar
    cargarTodo();
  </script>
</body>
</html>
